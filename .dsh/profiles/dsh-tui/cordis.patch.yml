# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: session-title-llm
  name: "@deepseek-ai/dsh-session-title-first-prompt-llm"
  disabled: true

# Disable DeepSeek Platform
- id: llm-deepseek-account
  name: "@deepseek-ai/dsh-llm-deepseek-account"
  disabled: true
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  disabled: true
- id: deepseek-account
  name: "@deepseek-ai/dsh-deepseek-account-platform"
  disabled: true
- id: deepseek-llm-api-extensions
  name: "@deepseek-ai/dsh-deepseek-llm-api-extensions"
  disabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  disabled: true
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  disabled: true
- id: plugin-package-inventory-deepseek
  name: "@deepseek-ai/dsh-plugin-package-inventory-deepseek"
  disabled: true
- id: account-controller
  name: "@deepseek-ai/dsh-api-account-controller"
  disabled: true

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: neuraldeep
    model: qwen3.6-fp8
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      neuraldeep:
        displayName: NeuralDeep
        baseURL: https://api.neuraldeep.ru/v1
        api: openai-responses
        apiKeyEnv: NEURALDEEP_API_KEY
        models:
          - id: qwen3.6-fp8
            name: "NeuralDeep: Qwen 3.6 FP8"
            contextWindow: 46112
            maxTokens: 235929
            input:
              - text
              - image
          - id: qwen3.6-fp8-noreason
            name: "NeuralDeep: Qwen 3.6 FP8 noreason"
            contextWindow: 46112
            maxTokens: 235929
            input:
              - text
              - image
      neurly:
        displayName: Neurly
        baseURL: https://neurly.ru/v1
        api: openai-responses
        apiKeyEnv: NEURLY_API_KEY
        models:
          - id: deepseek/deepseek-v4-flash
            name: "Neurly: DeepSeek V4 Flash"
            contextWindow: 1048576
            maxTokens: 384000
          - id: deepseek/deepseek-v4-flash-0731
            name: "Neurly: DeepSeek V4 Flash 0731"
            contextWindow: 1048576
            maxTokens: 384000
          - id: deepseek/deepseek-v4.1-flash
            name: "Neurly: DeepSeek V4.1 Flash"
            contextWindow: 1048576
            maxTokens: 384000
            input:
              - text
              - image
          - id: deepseek/deepseek-v4.1-flash-1017
            name: "Neurly: DeepSeek V4.1 Flash 1017"
            contextWindow: 1048576
            maxTokens: 384000
            input:
              - text
              - image
          - id: qwen/qwen3.7-flash
            name: "Neurly: Qwen 3.7 Flash"
            contextWindow: 1000000
            maxTokens: 65536
            input:
              - text
              - image
