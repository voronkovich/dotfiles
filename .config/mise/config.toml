[tools]
node = "24"
uv = "latest"

[bootstrap.user]
login_shell = "tmux"

[bootstrap.packages]
# Tools
"apt:bat" = "latest"
"apt:curl" = "latest"
"apt:extrepo" = "latest"
"apt:fd-find" = "latest"
"apt:fzf" = "latest"
"apt:git" = "latest"
"apt:htop" = "latest"
"apt:neovim" = "latest"
"apt:podman" = "latest"
"apt:pwgen" = "latest"
"apt:ripgrep" = "latest"
"apt:tmux" = "latest"
"apt:zsh" = "latest"
"brew:bun" = "latest"
"brew:symfony-cli/tap/symfony-cli" = "latest"
"brew:transcrypt" = "latest"
"brew:rtk" = "latest"

# Build tools
"apt:autoconf" = "latest"
"apt:bison" = "latest"
"apt:build-essential" = "latest"
"apt:gettext" = "latest"
"apt:pkg-config" = "latest"
"apt:re2c" = "latest"

[bootstrap.repos]
"~/projects/aicommmit" = { url = "git@github.com:voronkovich/aicommit.git" }
"~/projects/ansibled" = { url = "git@github.com:voronkovich/ansibled.git" }
"~/projects/sniphpets-luasnip" = { url = "git@github.com:sniphpets/sniphpets-luasnip.git" }

[bootstrap.hooks.final]
run = [
    "ln -s ~/projects/aicommmit/aicommit ~/.local/bin || true",
    "[ -f ~/.config/opencode/plugins/rtk.ts ] || rtk init -g --opencode",
]
