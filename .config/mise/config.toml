[tools]
node = "24"
uv = "latest"
gh = "latest"

[bootstrap.user]
login_shell = "tmux"

[bootstrap.packages]
# Tools
"apt:bat" = "latest"
"apt:curl" = "latest"
"apt:extrepo" = "latest"
"apt:fd-find" = "latest"
"apt:fzf" = "latest"
"apt:git" = "latest"
"apt:htop" = "latest"
"apt:podman" = "latest"
"apt:pwgen" = "latest"
"apt:tmux" = "latest"
"apt:zsh" = "latest"
"brew:bun" = "latest"
"brew:symfony-cli/tap/symfony-cli" = "latest"
"brew:transcrypt" = "latest"

# Build tools
"apt:autoconf" = "latest"
"apt:bison" = "latest"
"apt:build-essential" = "latest"
"apt:gettext" = "latest"
"apt:pkg-config" = "latest"
"apt:re2c" = "latest"

[bootstrap.repos]
"~/projects/ansibled" = { url = "git@github.com:voronkovich/ansibled.git" }
